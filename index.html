<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il mio diario di viaggio</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Grafiche decorative fisse ai 4 angoli -->
  <img src="assets/images/lampione.png" alt="" class="decorazione-angolo decorazione-lampione">
  <img src="assets/images/decorazione2.PNG" alt="" class="decorazione-angolo decorazione-alto-destra">
  <img src="assets/images/decorazione1.png" alt="" class="decorazione-angolo decorazione-basso-sinistra">
  <img src="assets/images/inchiostro3.png" alt="" class="decorazione-angolo decorazione-inchiostro">

  <div class="site-container">
    <!-- Intestazione -->
    <header class="site-header">
      <h1 class="site-title">Il mio diario di viaggio</h1>
      <p class="site-subtitle">Appunti, storie e ricordi in giro per il mondo</p>
      <!-- Immagine divisore al posto della riga -->
      <img src="assets/images/decorazione3.png" alt="" class="divisore-decorativo">
    </header>

    <!-- Griglia dove appariranno le box dei post -->
    <main id="posts-container" class="posts-grid">
      <!-- Le box verranno inserite automaticamente qui -->
    </main>
  </div>

  <!-- Finestra modale per leggere il post completo -->
  <div id="post-modal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button class="close-btn" onclick="chiudiPost()" aria-label="Chiudi">&times;</button>
      <div id="modal-meta" class="modal-meta"></div>
      <h2 id="modal-title" class="modal-title"></h2>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Il file script.js è nella radice -->
  <script src="script.js"></script>
</body>
</html>
