<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il mio diario di viaggio</title>
  <link rel="stylesheet" href="assets/css/style.css?v=7000">
</head>
<body>

  <!-- Elementi decorativi di sfondo -->
  <div class="decorazione-mongolfiera"></div>
  <div class="decorazione-alto-destra"></div>
  <div class="decorazione-basso-sinistra"></div>
  <div class="decorazione-inchiostro"></div>

  <div class="site-container">
    <!-- Intestazione -->
    <header class="site-header">
      <!-- Contenitore con timbro1 a destra e timbro2 a sinistra -->
      <div class="title-container">
        <h1 class="site-title">Il mio diario di viaggio</h1>
      </div>
      
      <p class="site-subtitle">Appunti, storie e ricordi in giro per il mondo</p>
      
      <!-- Divisore con luci1, luci2 e luci3 in versione ridotta -->
      <div class="divisore-luci-container">
        <div class="luci-elemento luci-1"></div>
        <div class="luci-elemento luci-2"></div>
        <div class="luci-elemento luci-3"></div>
      </div>
    </header>

    <!-- Griglia dei post -->
    <main id="posts-container" class="posts-grid"></main>
  </div>

  <!-- Finestra modale per leggere il post completo -->
  <div id="post-modal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button class="close-btn" onclick="chiudiPost()" aria-label="Chiudi">&times;</button>
      <div id="modal-meta" class="modal-meta"></div>
      <h2 id="modal-title" class="modal-title"></h2>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
